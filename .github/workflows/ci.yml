name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install root tooling
        run: pnpm install --ignore-workspace --no-frozen-lockfile

      - name: Typecheck core
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Install Navigator dependencies
        run: pnpm install --ignore-workspace --no-frozen-lockfile
        working-directory: apps/navigator

      - name: Build Navigator
        run: pnpm build
        working-directory: apps/navigator
