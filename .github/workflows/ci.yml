name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck core
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Install Navigator dependencies
        run: npm install --no-audit --no-fund
        working-directory: apps/navigator

      - name: Build Navigator
        run: npm run build
        working-directory: apps/navigator
